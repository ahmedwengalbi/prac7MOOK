<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JavaScript практика — ПР №7</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Интерактивная страница</h1>

<!-- ===== Блок 1: изменение текста и стиля ===== -->
<section class="block">
  <h2>1. Клик по кнопке</h2>
  <button id="myButton">Нажми меня</button>
  <p id="text">Привет, мир!</p>
</section>

<!-- ===== Блок 2: смена фона ===== -->
<section class="block">
  <h2>2. Смена фона страницы</h2>
  <button id="bgButton">Изменить фон</button>
  <button id="resetButton">Сбросить фон</button>
</section>

<!-- ===== Блок 3: счётчик кликов ===== -->
<section class="block">
  <h2>3. Счётчик кликов</h2>
  <button id="counterButton">Кликнуто: 0 раз</button>
</section>

<!-- ===== Блок 4: ввод имени ===== -->
<section class="block">
  <h2>4. Приветствие по имени</h2>
  <input type="text" id="nameInput" placeholder="Введите имя">
  <button id="greetButton">Поздороваться</button>
  <p id="greetText"></p>
</section>

<script src="script.js"></script>
</body>
</html>
